# alembic.ini — Alembic configuration for ai-readiness-pipeline.
#
# NOTE: Alembic uses a SYNC SQLite engine (see alembic/env.py header).
# The application runtime uses an ASYNC engine (sqlite+aiosqlite) in app/db/session.py.
# Both point at the same DB file. They are separate driver instances by design.
# Do NOT change sqlalchemy.url here to the async URL — Alembic's migration runner
# does not support async engines cleanly.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template for new migration filenames.
# %(year)d%(month).2d%(day).2d_%(rev)s_%(slug)s.py matches our naming convention:
# 20260502_0001_baseline.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for file_template date stamps.
timezone = UTC

# Truncate slug to this length.
truncate_slug_length = 40

# Revision environment — set to true to always show current revision on startup.
revision_environment = false

# The sync SQLite URL. Must match the file path used by the async engine.
# Override via environment: ALEMBIC_DB_URL or set sqlalchemy.url here.
sqlalchemy.url = sqlite:///app/data/app.db

# Logging configuration — passed to Python logging.config.fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
