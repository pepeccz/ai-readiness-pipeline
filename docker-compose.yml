services:
  pipeline:
    build: .
    container_name: air-pipeline
    restart: unless-stopped
    ports:
      - "8100:8100"
    env_file:
      - .env
    volumes:
      - ./assets:/app/assets:ro
      - ./tools_catalog.md:/app/tools_catalog.md:ro
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
