blocks_order:
  - block-1-strategic
  - block-2-process-critical-full
  - block-3-data
  - block-4-talent
  - block-5-infrastructure
  - block-6-compliance
  - block-7-governance

block_2_variants:
  full: block-2-process-critical-full
  reduced: block-2-process-critical-reduced
  cross_area: block-2-process-critical-cross-area

area_overlays:
  attention: {}
  marketing: {}
  sales: {}
  operations: {}
  finance: {}
  hr: {}
  product: {}

area_selector:
  questions:
    - id: primary_area
      type: single_choice
      required: true
      layer: core
      label: "¿Cuál es el área principal donde duele más en tu empresa?"
      helper_text: "Elegí el área donde querés ver el mayor impacto de IA primero."
      options:
        - value: attention
          label: "Atención al cliente"
        - value: marketing
          label: "Marketing"
        - value: sales
          label: "Ventas"
        - value: operations
          label: "Operaciones"
        - value: finance
          label: "Finanzas"
        - value: hr
          label: "Recursos Humanos"
        - value: product
          label: "Producto / Desarrollo"
        - value: cross_area_communication
          label: "Comunicación entre áreas (problema transversal)"
        - value: other
          label: "Otra área"
    - id: secondary_area
      type: single_choice
      required: false
      layer: core
      label: "¿Hay un segundo área donde también querés explorar?"
      helper_text: "Opcional — presentaremos un análisis reducido del proceso secundario."
      show_if:
        field: primary_area
        op: not_in
        value: [cross_area_communication]
      options:
        - value: attention
          label: "Atención al cliente"
        - value: marketing
          label: "Marketing"
        - value: sales
          label: "Ventas"
        - value: operations
          label: "Operaciones"
        - value: finance
          label: "Finanzas"
        - value: hr
          label: "Recursos Humanos"
        - value: product
          label: "Producto / Desarrollo"
        - value: other
          label: "Otra área"
    - id: areas_involved
      type: multi_choice
      required: true
      layer: core
      label: "¿Qué áreas están involucradas en el problema transversal?"
      helper_text: "Seleccioná entre 2 y 4 áreas."
      min_selections: 2
      max_selections: 4
      show_if:
        field: primary_area
        op: eq
        value: cross_area_communication
      options:
        - value: attention
          label: "Atención al cliente"
        - value: marketing
          label: "Marketing"
        - value: sales
          label: "Ventas"
        - value: operations
          label: "Operaciones"
        - value: finance
          label: "Finanzas"
        - value: hr
          label: "Recursos Humanos"
        - value: product
          label: "Producto / Desarrollo"
        - value: tech_it
          label: "Tecnología / IT"
        - value: leadership
          label: "Dirección"
